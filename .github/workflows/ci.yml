name: PHP quality checks
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    test:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo_sqlite, mbstring, curl
                  coverage: none
            - run: composer validate --strict
            - run: composer install --no-interaction --no-plugins --no-scripts
            - run: composer lint
            - run: composer test
            - run: php tests/http.php
            - run: STOCKROOM_TEST_EPHEMERAL=true php tests/http.php
