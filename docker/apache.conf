<VirtualHost *:10000>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    LogFormat "%h %t \"%m %U %H\" %>s %b" stockroom
    CustomLog /proc/self/fd/1 stockroom
</VirtualHost>
ServerTokens Prod
ServerSignature Off
